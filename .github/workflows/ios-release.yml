name: iOS release (App Store)

# Tag a release (v1.0.0) or run manually. Archives and, with signing secrets
# present, uploads a build to TestFlight.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight after archiving'
        required: false
        default: false
        type: boolean

jobs:
  archive:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }

      - run: npm ci
      - name: Verify the web bundle before it is packaged
        run: npm run verify
      - name: Versions must be in sync
        run: node tools/set-version.js --check
      - name: Listing copy, screenshots and placeholders
        run: npm run check:store
      - run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      - name: Import signing certificate and profile
        id: signing
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$PROFILE_B64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets are not set - compiling for the simulator only."
            exit 0
          fi
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 -d > "${RUNNER_TEMP}/cert.p12"
          security import "${RUNNER_TEMP}/cert.p12" -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 -d > \
            "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Compile for simulator (no signing available)
        if: steps.signing.outputs.signed != 'true'
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Archive and export IPA
        if: steps.signing.outputs.signed == 'true'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath "${RUNNER_TEMP}/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" archive
          cat > "${RUNNER_TEMP}/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "${RUNNER_TEMP}/App.xcarchive" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -exportPath "${RUNNER_TEMP}/export"

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: fab-shop-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      # App Store Connect API key: issuer id, key id, and the .p8 contents.
      - name: Upload to TestFlight
        if: steps.signing.outputs.signed == 'true' && (github.event_name == 'push' || inputs.upload)
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          xcrun altool --upload-app -f "${RUNNER_TEMP}"/export/*.ipa -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
