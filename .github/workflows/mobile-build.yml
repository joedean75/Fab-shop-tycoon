name: Mobile build check

on:
  pull_request:
    # Includes the workflows themselves, so a change to CI is checked by the
    # pull request that makes it rather than after it lands on main.
    paths: ['fab-shop/**', 'android/**', 'ios/**', 'tools/**', 'package.json',
            'capacitor.config.json', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['fab-shop/**', 'android/**', 'ios/**', 'tools/**', 'package.json', 'capacitor.config.json']
  workflow_dispatch:

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Verify the static bundle
        run: npm run verify
      - name: Versions must be in sync across platforms
        run: node tools/set-version.js --check

  android:
    name: Android (debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '21' }
      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the retired "tools"
          # package, which makes sdkmanager exit 1.
          packages: 'platform-tools'
      - name: Install the SDK this project compiles against
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Copy the web build into the native project
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fab-shop-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    # macOS runners are expensive, so this normally skips pull requests -
    # except when the pull request is changing CI itself.
    name: iOS (compile, unsigned)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Copy the web build into the native project
        run: npx cap sync ios
      # Capacitor 8 uses Swift Package Manager, not CocoaPods: there is no
      # Podfile and no .xcworkspace, so build the project directly.
      - name: Build for simulator without signing
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build
